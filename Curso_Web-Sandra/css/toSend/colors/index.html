<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Colors</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    

    <div>
        <!-- were going to create a table under that one, i orderer 
         by class that makes my code easaly to give the color that he ask for-->

        <table border="1">
            <thead class="head">
                <th >teal</th>
                <th class="f">teal</th>
                <th class="s">teal</th>
                <th class="t">teal</th>
            </thead>

            <tbody>
                <tr class="red">
                    <td >red</td>
                    <td class="f">red</td>
                    <td class="s">red</td>
                    <td class="t">red</td>
                </tr>

                <!--Adding a class to a tr, and td-->
                <tr class="blue">
                    <td >blue</td>
                    <td class="f">blue</td>
                    <td class="s">blue</td>
                    <td class="t">blue</td>
                </tr>

                <tr class="orange" >
                    <td >orange</td>
                    <td class="f">orange</td>
                    <td class="s">orange</td>
                    <td class="t">orange</td>
                </tr>
                <tr class="pur">
                    <td >purple</td>
                    <td class="f">purple</td>
                    <td class="s">purple</td>
                    <td class="t">purple</td>
                </tr>

                <tr class="olive">
                    <td >olive</td>
                    <td class="f">olive</td>
                    <td class="s">olive</td>
                    <td class="t">olive</td>
                </tr>

                <tr class="fuc">
                    <td >Fuchsia</td>
                    <td class="f">Fuchsia</td>
                    <td class="s">Fuchsia</td>
                    <td class="t">Fuchsia</td>
                </tr>

                <tr class="green">
                    <td >green</td>
                    <td class="f">green</td>
                    <td class="s">green</td>
                    <td class="t">green</td>
                </tr>
                 
            </tbody>

        </table>
    </div>


</body>
</html>
