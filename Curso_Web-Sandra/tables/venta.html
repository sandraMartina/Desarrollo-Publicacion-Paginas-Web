<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Ventas Mensuales</title>
</head>

<body>

    <table border="1">
        <caption><h1>Ventas Mensuales</h1></caption>
        <!-- ============ La cabecera de la tabla ============ -->

        <!-- ============   colspan -> Combina la tabla en horizontal(atributos)
                            rowspan -> Combina la tabla en vertical
         <thead>
            <tr>
            <th>Plato</th>
            <th>Precio</th>
            <th>Cantidad</th>
            <td colspan="3"></td>
        </tr>
            
        </thead> ============ -->

        <thead>
            <th>Producto</th>
            <th>Enero</th>
            <th>Febrero</th>
            <th>Marzos</th>
        </thead>
        <!-- ============ cuerpo de la tabla ============ -->
        <tbody>
            <tr>
                <td>Laptops</td>
                <td>$12,000</td>
                <td>$15,000</td>
                <td>$18,000</td>
            </tr>
            <tr>
                <td>Monitores</td>
                <td>$8,000</td>
                <td>$9500</td>
                <td>$11,000</td>
            </tr>

            <tr>
                <td>Total</td>
                <td>$20,000</td>
                <td>$24,500</td>
                <td>$29,000</td>
            </tr>
        </tbody>

        <!-- ============ Pie de la tabla ============ -->





    </table>
</body>

</html>
