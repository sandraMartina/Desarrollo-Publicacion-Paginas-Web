<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Horario Escolar</title>
</head>
<body>
    <div>
        <table border="1">
            <caption>
                <h1>Horario Escolar</h1>
                <p>Curso: 2º Eso</p>
                <h3>Horario Semanal</h3>
            </caption>
            
            <thead>
                <tr>
                    <td>Hora</td>
                    <td>Lunes</td>
                    <td>Martes</td>
                    <td>Miercoles</td>
                </tr>

            </thead>

            <tbody>
                <tr>
                    <td>9:00</td>
                    <td>Matematicas</td>
                    <td>Lengua</td>
                    <td>Ingles</td>
                </tr>

                <tr>
                    <td>10:00</td>
                    <td>Lengua</td>
                    <td>Matematicas</td>
                    <td>Educacion Fisica</td>                   
                </tr>

                <tr>
                    <td>11:00</td>
                    <td rowspan="4">Proyecto Tecnologia</td>
                    <td>Historia</td>
                    <td>Plastica</td>
                </tr>

                <tr>
                    <td>12:00</td>
                    <td>Ciencias</td>
                    <td>Musica</td>
                </tr>
            </tbody>

            <tfoot>
                <tr>
                    <td colspan="4" style="text-align: center;"><i>Horario Sujeto a cambios</i></td>
                </tr>
            </tfoot>


        </table>
        <br>
        <br>

        <button type="button" onclick="window.print()">Imprimir Horario</button>
    </div>
</body>
</html>
