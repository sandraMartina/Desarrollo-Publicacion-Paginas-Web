<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Tablas y celdas</title>
</head>
<body>
    <table border="1">
        <thead>
            <tr>
                <th>Celda</th>
                <th  colspan="4" style="text-align: center;">Celda</th>
             
            </tr>
        </thead>
        <tbody>
            <tr>
                <td >Celda</td>
                <td colspan="4" style="text-align: center;">Celda</td>
               
            </tr>
            <tr>
                <td rowspan="4" >Celda</td>
                <td>Celda</td>
                <td>Celda</td>
                <td>Celda</td>
            </tr>
            <tr>
                <td>Celda</td>
                <td>Celda</td>
                <td>Celda</td>
            </tr>
        </tbody>
    </table>

</body>
</html>
