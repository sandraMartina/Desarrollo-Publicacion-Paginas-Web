<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Tables</title>
</head>

<body>

    <table border="1">
        <caption>Mi tabla</caption>
        <!-- ============ La cabecera de la tabla ============ -->

        <!-- ============   colspan -> Combina la tabla en horizontal(atributos)
                            rowspan -> Combina la tabla en vertical
         <thead>
            <tr>
            <th>Plato</th>
            <th>Precio</th>
            <th>Cantidad</th>
            <td colspan="3"></td>
        </tr>
            
        </thead> ============ -->

        <thead>
            <th>Plato</th>
            <th>Precio</th>
            <th>Cantidad</th>
        </thead>
        <!-- ============ cuerpo de la tabla ============ -->
        <tbody>
            <tr>
                <td>papas</td>
                <td>5</td>
                <td>1</td>
            </tr>
            <tr>
                <td>Calamares</td>
                <td>7</td>
                <td>2</td>
            </tr>
        </tbody>

        <!-- ============ Pie de la tabla ============ -->





    </table>
</body>

</html>
