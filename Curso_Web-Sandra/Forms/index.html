<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Formularios</title>
    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="style.css" />
  </head>
  <body>

    <form action="destiny.html" method="get">
        <fieldset>
                <legend>INPUT</legend>
                            <!-- NAME -->
                    <label for="name">Name:</label>
                    <input type="text" name="" id="name" placeholder="Write your name here"required />
                    <button type="submit">Send</button>
                    <br /><br />
                            <!-- BIRTHDAY -->
                    <label for="birthday">Birthday:</label>
                    <input type="date" name="birthday" id="birthday" />
                    <br /><br />
                                <!-- TIME -->
                    <label for="time"> Time</label>
                    <input type="time" name="time" id="time" />
                    <br /><br />
                                <!-- month -->
                    <label for="month">Month</label>
                    <input type="month" name="month" id="month" >
                    <br /><br />

                                <!--Fecha / hora-->
                    <label for="dateMonth">Fecha / hora</label>
                    <input type="datetime-local" name="dateMonth" id="dateMonth">
                    <br /><br />



                    <!-- if i want to move every value that i add use step -->
                     <!-- AGE -->
                    <label for="age">Age:</label>
                    <input type="number" name="age" id="age" min="18" max="100" />
                    <br /><br />


                    <!-- <label for="phone">Phone:</label>
                    <input type="tel" min="0" name="phone" id="phone" />
                    <br /><br /> -->

                                 <!-- telefono -->
                    <label for="prefix">Country:</label>

                    <select name="prefix" id="prefix">
                        <option value="+34">🇪🇸 +34 Spain</option>
                        <option value="+502">🇬🇹 +502 Guatemala</option>
                        <option value="+33">🇫🇷 +33 France</option>
                        <option value="+44">🇬🇧 +44 United Kingdom</option>
                        <option value="+81">🇯🇵 +81 Japan</option>
                        <option value="+82">🇰🇷 +82 South Korea</option>
                    </select>

                    <label for="phone">Phone:</label>
                    <input type="tel" name="phone" id="phone" required>
                    <br><br>


                    <!-- Email -->
                    <label for="email"> Email:</label>
                    <input type="email" name="email" id="email" />
                    <br /><br />

                    <!-- Gender -->
                    <p>Gender:</p>
                    <!-- in this one we have the option "checked" -->
                    <label> <input type="radio" name="gender" value="male" /> Male </label>
                    <label>
                    <input type="radio" name="gender" value="female" /> Female
                    </label>
                    <br /><br />

                    <!--    Multiselections Languages -->
                    <p>Languages you know:</p>
                    <label>
                    <input type="checkbox" name="language" value="html" /> HTML
                    </label>

                    <label>
                    <input type="checkbox" name="language" value="css" /> CSS
                    </label>

                    <label>
                    <input type="checkbox" name="language" value="javascript" />
                    JavaScript
                    </label>

                    <br /><br />
                        <!-- con el value nos da un valor inicial -->
                         <!-- RANGE -->

                    <label for="rango">Rango</label>
                    <input type="range" name="range" min="20" max="100" step="20" />

                    <!-- subir archivo-->
                    <br /><br />
                    <label for="file"> File:</label>
                    <input type="file" name="file" id="file" />

                    <br /><br />
        </fieldset>

      <fieldset>
        <legend>SELECT</legend>
                      <!-- Multiple Selection-->
            <label for="country">Country:</label>
            <!-- para seleccionar agrego lo del multiple con size 1 -->
            <select name="country" id="country" multiple size="1">
            <option value="empy">-</option>
            <optgroup label="Favorites places">
                <option value="guatemala">Guatemala</option>
                <option value="spain">Spain</option>
            </optgroup>
            <optgroup label="To VISIT SOON">
                <option value="japan">Japan</option>
                <option value="korea">South Korea</option>
            </optgroup>
            </select>

            <br /><br />
      </fieldset>

      <fieldset>
         <!-- only one Selection-->
        <legend>TEXTAREA</legend>
                <!-- Message -->
                <!-- cols="30" the wide of the text area 
                    rows = HEIGHT
                    cols = WIDTH-->
                <label for="message">About you:</label>
                <br />

                <textarea
                name="message"
                id="message"
                rows="5"
                cols="55"
                minlength="20"
                maxlength="200"
                placeholder="Write something about yourself..."
                required
                ></textarea>
                <br /><br />
                <label for="color">Color Favorito:</label>
                <input type="color" name="color" id="color" />

                <br /><br />
      </fieldset>

      <fieldset>
        <legend>Barra de progeso</legend>
                <label for="barraProgreso">Barra de progreso</label>
                <progress max="20" value="10"></progress>
      </fieldset>

    </form>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
  </body>
</html>
