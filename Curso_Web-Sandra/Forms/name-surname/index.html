<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Formulario</title>
     <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet" />
    <link rel="stylesheet" href="style.css">
</head>
<body>
    
    <form action="datos.html" method="get">

        <fieldset>
            <legend>Informacion personal</legend>
                <label for="name">Name:</label>
                <input type="text" name="name" id="name" placeholder="Write your name here" required>
                <br><br>
                <label for="name">Last Name:</label>
                <input type="text" name="lastname" id="name" placeholder="Write your last name here" required> 
                <br><br>
                <label for="age"> Age:</label>
                <input type="number" name="age" id="age" min="18" max="35" required>
                <br><br>

                <label for="birthday"> Birthday:</label>
                <input type="date" name="birthday" required >
                <br><br>
        </fieldset>


        <fieldset>
              <!-- Selection multiple -->
               <legend>Seleccion Multiple</legend>
                 <label for="Futbol">
                    <input type="checkbox" name="selection" value="futbol" checked> Futbol
                </label>
                <label for="Baloncesto">
                    <input type="checkbox" name="selection" value="baloncesto"> Baloncesto
                </label>
                <label for="Tennis">
                    <input type="checkbox" name="selection" value="tenis"> Tennis
                </label>

                <br><br>

        </fieldset>
      
       
        <!-- Selection unica -->
         <label for="soltero">
            <input type="radio" name="uniqueS" id="soltero" checked required> Soltero
         </label>
        <label for="casado">
            <input type="radio" name="uniqueS" id="casado" required> Casado
         </label>
        <label for="viudo">
            <input type="radio" name="uniqueS" id="viudo" required> Viudo
         </label>

         <br><br>
         
    </form>

         <!-- adding code from bootstrap -->
            <div class="d-flex gap-2 justify-content-center py-5"> 
                <button class="btn btn-success rounded-pill px-3" type="submit">Send</button> 
                <button class="btn btn-warning rounded-pill px-3" type="reset">Reset</button> 

                <button class="btn btn-primary" type="button" disabled=""> 
                <span class="spinner-border spinner-border-sm" aria-hidden="true"></span>
                <span role="status">Loading...</span> </button> 
            </div>


</body>
</html>
