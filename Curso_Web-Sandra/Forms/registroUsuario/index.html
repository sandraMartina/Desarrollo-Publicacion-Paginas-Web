<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>User Registration</title>
    <!-- <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"rel="stylesheet"/> -->
    <link rel="stylesheet" href="style.css">
</head>

<body class="userReg">

    <h1>User Registration</h1>

    <div class="form">
        <form action="response.html" method="get">

            <fieldset class="fiel1">
                <legend>Personal Information</legend>

                    <label for="name" >Name:</label> <br>
                    <input type="text" name="name" id="name" placeholder="Ex: Sandra T" min="3" max="40" size="20" autofocus>
                    <p class="sizeCar">Entre 3 y 40 caracteres</p>

                    <br><br>

                    <label for="birthday"> Date of Birthday: </label> <br>
                    <input type="date" name="birthday" id="birthday" required>
                    <br><br>

                    <p id="gender">Gender:</p>
                    <label for="gender"> <input type="radio" name="gender" value="male" id="gender"> Male </label>
                    <label for="gender"> <input type="radio" name="gender" value="female"> Female </label>
                    <label for="gender"> <input type="radio" name="gender" value="otro" id="gender"> Otro/prefiero no decirlo</label>
                    <br><br>

                    <label for="country">Country of Residency</label> <br>
                        <select name="country" id="country" >
                            <option value="empty">--Selecciona un país--</option>
                            <optgroup label="Europa">
                                <option value="españa">España</option>
                                <option value="francia">Francia</option>
                                <option value="portugal">Portugal</option>
                                <option value="italia">Italia</option>
                            </optgroup>
                            <optgroup label="América">
                                <option value="guatemala">Guatemala</option>
                                <option value="mexico">México</option>
                                <option value="colombia">Colombia</option>
                            </optgroup>
                        </select>
            </fieldset>

            <fieldset class="fiel2">
                <legend >Account Information</legend>
                    <label for="email">Email</label> <br>
                    <input type="email" name="email" id="email" placeholder="example@domain.com" required>
                    <br><br>

                    <label for="password">Password</label> <br>
                    <input type="password" name="password" id="password" min="6" required>
                    <p class="sizeCar">Mínimo 6 caracteres</p>
                    <br>

                    <label for="password">Repeat the Password</label> <br>
                    <input type="password" name="password" id="password" min="6" required>
                    <br>
                    <br>
                    <input type="checkbox" name="checkbox" id="checkbox" required> Acepto los términos y condiciones
            </fieldset>

                    <div class="buttns">
                        <button type="submit" class="register"> Registrarme</button>
                        <button type="reset" class="erase"> Borrar Formulario</button>            
                    </div>


        </form>


    </div>
    
    


   <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script> 
</body>
</html>
